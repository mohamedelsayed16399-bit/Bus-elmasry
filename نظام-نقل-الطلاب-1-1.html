<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام إدارة نقل الطلاب</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=Space+Mono&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0E1A2E;
    --navy-2:#16294A;
    --navy-3:#22406E;
    --amber:#EFA000;
    --amber-2:#FFD166;
    --cream:#F7F2E4;
    --paper:#FFFFFF;
    --ink:#151F32;
    --ink-soft:#606E89;
    --ink-faint:#8A93A8;
    --line:#E6DFC9;
    --line-soft:#EFEADA;
    --danger:#BB3E2D;
    --danger-bg:#FBEAE6;
    --good:#1F7A52;
    --good-bg:#E8F5EE;
    --radius:16px;
    --radius-sm:10px;
    --shadow-sm: 0 2px 8px -4px rgba(14,26,46,.18);
    --shadow: 0 14px 34px -18px rgba(14,26,46,.35), 0 2px 8px -4px rgba(14,26,46,.12);
    --shadow-lg: 0 24px 60px -20px rgba(14,26,46,.45);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Tajawal', sans-serif;
    background:var(--cream);
    color:var(--ink);
    min-height:100vh;
    background-image:
      radial-gradient(circle at 100% 0%, rgba(239,160,0,.10), transparent 42%),
      radial-gradient(circle at 0% 12%, rgba(14,26,46,.06), transparent 38%),
      repeating-linear-gradient(135deg, rgba(14,26,46,.018) 0 2px, transparent 2px 34px);
    background-attachment:fixed;
  }
  .mono{font-family:'Space Mono', monospace;}

  @keyframes riseIn{ from{ opacity:0; transform:translateY(10px);} to{ opacity:1; transform:translateY(0);} }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; }
  }

  .app{display:flex; min-height:100vh;}
  .sidebar{
    width:246px; flex-shrink:0;
    background:
      radial-gradient(circle at 10% 0%, rgba(239,160,0,.10), transparent 55%),
      linear-gradient(190deg, var(--navy), var(--navy-2) 60%, var(--navy-3));
    color:#fff;
    padding:24px 16px;
    display:flex; flex-direction:column; gap:4px;
    position:sticky; top:0; height:100vh;
    box-shadow: 4px 0 30px -12px rgba(0,0,0,.35);
  }
  .brand{display:flex; align-items:center; gap:11px; margin-bottom:22px; padding:0 6px;}
  .brand-badge{
    width:42px;height:42px;border-radius:12px;
    background:linear-gradient(155deg, var(--amber-2), var(--amber));
    color:var(--navy);
    display:flex;align-items:center;justify-content:center;
    font-weight:900; font-size:19px;
    box-shadow: 0 6px 16px -4px rgba(239,160,0,.55), inset 0 1px 0 rgba(255,255,255,.5);
  }
  .brand-text{font-weight:900; font-size:16px; line-height:1.3; letter-spacing:.2px;}
  .brand-text span{display:block; font-weight:500; font-size:10.5px; opacity:.55; letter-spacing:.6px; margin-top:1px;}

  .navlink{
    display:flex; align-items:center; gap:10px;
    padding:11px 13px; border-radius:10px;
    color:rgba(255,255,255,.68);
    cursor:pointer; font-size:14px; font-weight:500;
    border:1px solid transparent;
    border-inline-start:3px solid transparent;
    transition:.15s ease;
    user-select:none;
  }
  .navlink:hover{background:rgba(255,255,255,.07); color:#fff;}
  .navlink.active{
    background:linear-gradient(90deg, rgba(239,160,0,.16), rgba(239,160,0,.04));
    border-color:rgba(239,160,0,.22);
    border-inline-start:3px solid var(--amber);
    color:var(--amber-2);
    font-weight:700;
  }
  .navlink .dot{width:5px;height:5px;border-radius:50%;background:currentColor; opacity:.65;}
  .navlink.active .dot{background:var(--amber); opacity:1; box-shadow:0 0 0 3px rgba(239,160,0,.2);}
  .sidebar-foot{margin-top:auto; padding:10px 6px; font-size:11px; color:rgba(255,255,255,.4); border-top:1px dashed rgba(255,255,255,.16); padding-top:16px;}

  .main{flex:1; padding:30px 34px 64px; min-width:0;}
  .topbar{display:flex; align-items:flex-end; justify-content:space-between; flex-wrap:wrap; gap:14px; margin-bottom:6px;}
  .topbar h1{font-size:25px; margin:0 0 6px; font-weight:900; letter-spacing:-.3px; color:var(--navy); position:relative; display:inline-block;}
  .topbar p{margin:0; color:var(--ink-soft); font-size:13.5px;}

  .road{
    height:12px; margin:18px 0 28px;
    background-image: repeating-linear-gradient(to left, var(--amber) 0 20px, transparent 20px 38px);
    background-position:center; background-repeat:no-repeat; background-size:100% 3px;
    opacity:.8; position:relative;
  }
  .road::before, .road::after{
    content:""; position:absolute; top:50%; width:6px; height:6px; border-radius:50%;
    background:var(--navy); transform:translateY(-50%); opacity:.25;
  }
  .road::before{ right:0; }
  .road::after{ left:0; }

  .stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(168px,1fr)); gap:14px; margin-bottom:8px;}
  .stat{
    background:var(--paper); border:1px solid var(--line); border-radius:var(--radius);
    padding:17px 19px; box-shadow:var(--shadow-sm);
    border-inline-start:4px solid var(--navy-3);
    animation:riseIn .35s ease both;
    transition:.18s ease;
  }
  .stat:hover{ box-shadow:var(--shadow); transform:translateY(-2px); }
  .stat .num{font-family:'Space Mono',monospace; font-size:27px; font-weight:700; color:var(--navy); letter-spacing:-.5px;}
  .stat .lbl{font-size:12px; color:var(--ink-soft); margin-top:4px; font-weight:500;}
  .stat.amber{ border-inline-start-color:var(--amber); }
  .stat.amber .num{color:#9c6a00;}

  .card{
    background:var(--paper); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow-sm); margin-bottom:18px; overflow:hidden;
    animation:riseIn .35s ease both;
  }
  .card-head{
    display:flex; align-items:center; justify-content:space-between; padding:17px 20px;
    border-bottom:1px dashed var(--line); gap:10px; flex-wrap:wrap;
    background:linear-gradient(180deg, #FCFAF3, var(--paper));
  }
  .card-head h2{margin:0; font-size:15.5px; font-weight:800; color:var(--navy); letter-spacing:.1px;}
  .card-body{padding:20px;}

  .btn{border:none; cursor:pointer; font-family:inherit; font-weight:700; font-size:13.5px; padding:10px 18px; border-radius:10px; transition:.15s ease; display:inline-flex; align-items:center; gap:6px;}
  .btn-primary{background:linear-gradient(165deg, var(--navy-3), var(--navy)); color:#fff; box-shadow:0 6px 16px -6px rgba(14,26,46,.5);}
  .btn-primary:hover{background:linear-gradient(165deg, #2b4a7d, var(--navy-2)); transform:translateY(-1px);}
  .btn-amber{background:linear-gradient(165deg, var(--amber-2), var(--amber)); color:var(--navy); box-shadow:0 6px 16px -6px rgba(239,160,0,.55);}
  .btn-amber:hover{filter:brightness(1.04); transform:translateY(-1px);}
  .btn-ghost{background:var(--paper); color:var(--ink-soft); border:1px solid var(--line);}
  .btn-ghost:hover{background:#F4EFE1; color:var(--ink);}
  .btn-danger{background:var(--danger-bg); color:var(--danger);}
  .btn-danger:hover{background:#f6d9d3;}
  .btn-sm{padding:7px 12px; font-size:12px; border-radius:8px;}
  .btn:disabled{opacity:.5; cursor:not-allowed; transform:none !important;}
  .btn:active{transform:translateY(0) scale(.98);}

  .form-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(205px,1fr)); gap:13px;}
  .field{display:flex; flex-direction:column; gap:6px;}
  .field label{font-size:11.5px; color:var(--ink-soft); font-weight:700; letter-spacing:.15px;}
  .field .req{color:var(--danger);}
  .field input, .field select{padding:10px 12px; border:1px solid var(--line); border-radius:9px; font-family:inherit; font-size:13.5px; background:#FFFDF7; color:var(--ink); transition:.15s;}
  .field input:hover, .field select:hover{border-color:#d8cfa8;}
  .field input:focus, .field select:focus{outline:none; box-shadow:0 0 0 3px rgba(239,160,0,.25); border-color:var(--amber);}
  .field.check{flex-direction:row; align-items:center; gap:8px; padding-top:20px;}
  .field.span2{grid-column:span 2;}
  .hint{font-size:11.5px; color:var(--ink-faint); margin-top:6px;}
  .error-text{font-size:12px; color:var(--danger); margin-top:10px; display:none; font-weight:600;}
  .error-text.show{display:block;}
  .form-actions{display:flex; gap:10px; margin-top:18px; justify-content:flex-end; align-items:center; padding-top:16px; border-top:1px dashed var(--line);}

  .table-wrap{overflow-x:auto;}
  table{width:100%; border-collapse:collapse; font-size:13px; min-width:560px;}
  th{text-align:right; padding:12px 14px; background:var(--navy); color:rgba(255,255,255,.85); font-weight:700; font-size:11px; text-transform:uppercase; letter-spacing:.5px; border-bottom:1px solid var(--line); white-space:nowrap;}
  th:first-child{border-top-right-radius:0;}
  td{padding:12px 14px; border-bottom:1px solid var(--line-soft); white-space:nowrap;}
  tbody tr{transition:.12s;}
  tbody tr:nth-child(even){background:#FCFAF2;}
  tr:hover td{background:#FBF1DC;}
  .pill{display:inline-block; padding:4px 11px; border-radius:999px; font-size:11px; font-weight:800; letter-spacing:.1px;}
  .pill.junior{background:#E3EEFF; color:#2255A4;}
  .pill.kg{background:#FFE9D6; color:#A6570B;}
  .pill.cover{background:#EBE5FF; color:#5B3FB0;}
  .pill.grade{background:#F0E9FF; color:#5B3FB0;}
  .pill.monthly{background:#E1F5E9; color:#1F7A43;}
  .pill.term{background:#FFEFD9; color:#A3690A;}
  .pill.yearly{background:#EFE3FF; color:#6A35C9;}
  .row-actions{display:flex; gap:6px;}
  .search-bar{display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
  .search-bar input, .search-bar select{padding:9px 13px; border:1px solid var(--line); border-radius:9px; font-family:inherit; font-size:13px; background:#FFFDF7;}
  .search-bar input:focus, .search-bar select:focus{outline:none; box-shadow:0 0 0 3px rgba(239,160,0,.22); border-color:var(--amber);}
  .empty{padding:44px 20px; text-align:center; color:var(--ink-soft);}
  .empty::before{content:"🚏"; display:block; font-size:26px; margin-bottom:8px; opacity:.6;}
  .empty b{display:block; color:var(--navy); font-size:15px; margin-bottom:4px; font-weight:800;}

  .absence-tags{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px;}
  .absence-tag{background:var(--danger-bg); color:var(--danger); font-size:11px; padding:4px 9px; border-radius:7px; display:flex; align-items:center; gap:5px; font-weight:700;}
  .absence-tag button{background:none;border:none;color:inherit;cursor:pointer;font-weight:900;font-size:12px;line-height:1;}

  .salary-box{background:linear-gradient(180deg,#FBF7EB,#F6F0DD); border:1px dashed #C9BD97; border-radius:12px; padding:14px 16px; margin-top:8px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;}
  .salary-box .calc{font-size:12px; color:var(--ink-soft);}

  .family-card{
    border:1px solid var(--line); border-radius:var(--radius); margin-bottom:16px; overflow:hidden;
    background:var(--paper); box-shadow:var(--shadow-sm); transition:.18s ease; animation:riseIn .35s ease both;
  }
  .family-card:hover{ box-shadow:var(--shadow); }
  .family-head{display:flex; justify-content:space-between; align-items:flex-start; gap:12px; padding:17px 20px; background:linear-gradient(180deg, #FCFAF3, var(--paper)); border-bottom:1px dashed var(--line); flex-wrap:wrap;}
  .family-info b{font-size:16px; color:var(--navy); font-weight:800;}
  .family-meta{display:flex; gap:14px; flex-wrap:wrap; margin-top:7px; font-size:12.5px; color:var(--ink-soft);}
  .family-stats{display:flex; gap:18px; align-items:center;}
  .family-stats .fs-num{font-family:'Space Mono',monospace; font-weight:700; font-size:17px; color:var(--navy);}
  .family-stats .fs-lbl{font-size:10.5px; color:var(--ink-faint); font-weight:600;}
  .family-actions{display:flex; gap:6px;}
  .family-body{padding:16px 20px 20px;}

  .toast{position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:var(--navy); color:#fff; padding:11px 22px; border-radius:11px; font-size:13px; font-weight:600; box-shadow:0 14px 34px rgba(0,0,0,.3); z-index:50; opacity:0; pointer-events:none; transition:.25s;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-6px);}
  .toast.err{background:var(--danger);}

  .loading{padding:44px; text-align:center; color:var(--ink-soft); font-weight:600;}
  .grade-price-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:11px;}
  .grade-price-item{display:flex; flex-direction:column; gap:5px; background:#FBF8EF; border:1px solid var(--line); border-radius:10px; padding:10px 11px; transition:.15s;}
  .grade-price-item:hover{border-color:var(--amber);}
  .grade-price-item label{font-size:11.5px; font-weight:700; color:var(--ink-soft);}
  .grade-price-item input{border:1px solid var(--line); border-radius:7px; padding:7px 9px; font-family:'Space Mono',monospace; font-size:13px;}

  .login-screen{
    position:fixed; inset:0;
    background:var(--navy);
    background-image:
      radial-gradient(circle at 25% 15%, rgba(239,160,0,.22), transparent 45%),
      radial-gradient(circle at 85% 85%, rgba(34,64,110,.5), transparent 50%),
      repeating-linear-gradient(135deg, rgba(255,255,255,.015) 0 2px, transparent 2px 30px);
    display:none; align-items:center; justify-content:center; z-index:100; padding:20px;
  }
  .login-card{
    background:var(--paper); border-radius:20px; padding:34px 28px; width:100%; max-width:350px;
    box-shadow:0 30px 70px rgba(0,0,0,.4); text-align:center; position:relative;
  }
  .login-card::before{
    content:""; position:absolute; left:0; right:0; top:126px; height:0;
    border-top:2px dashed var(--line); opacity:.9;
  }
  .login-card .brand-badge{width:54px;height:54px;border-radius:15px;background:linear-gradient(155deg, var(--amber-2), var(--amber));color:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:25px;margin:0 auto 14px; box-shadow:0 8px 20px -6px rgba(239,160,0,.55);}
  .login-card h2{margin:0 0 4px; font-size:20px; font-weight:900; color:var(--navy);}
  .login-card p{margin:0 0 22px; color:var(--ink-soft); font-size:13px;}
  .login-card input{width:100%; text-align:center; font-family:'Space Mono',monospace; font-size:21px; letter-spacing:7px; padding:13px; border:1px solid var(--line); border-radius:11px; margin-bottom:14px; background:#FFFDF7; transition:.15s;}
  .login-card input:focus{outline:none; box-shadow:0 0 0 3px rgba(239,160,0,.25); border-color:var(--amber);}
  .login-card .btn{width:100%; justify-content:center; padding:12px;}
  .login-card .error-text{margin-top:12px;}
  .role-tag{font-size:10.5px; padding:2px 9px; border-radius:999px; background:rgba(239,160,0,.18); color:var(--amber-2); display:inline-block; margin-inline-start:6px; font-weight:700;}
  .pill.role-admin{background:#EBE5FF; color:#5B3FB0;}
  .pill.role-supervisor{background:#FFE9D6; color:#B0570B;}
  .pill.role-driver{background:#E3EEFF; color:#2255A4;}
  .status-btns{display:flex; gap:6px;}

  @media (max-width: 820px){
    .app{flex-direction:column;}
    .sidebar{width:100%; height:auto; position:relative; flex-direction:row; overflow-x:auto; padding:14px;}
    .brand{margin-bottom:0;}
    .sidebar-foot{display:none;}
    .navlink{white-space:nowrap; border-inline-start:none; border-bottom:3px solid transparent;}
    .navlink.active{border-inline-start:none; border-bottom:3px solid var(--amber);}
    .main{padding:20px 16px 54px;}
  }
  :focus-visible{outline:2px solid var(--amber); outline-offset:2px;}

  .report-nav{display:flex; gap:8px; flex-wrap:wrap; margin:4px 0 18px;}

  @media print{
    .sidebar, .btn, .search-bar, .report-nav{ display:none !important; }
    body{ background:#fff !important; }
    .app{ display:block !important; }
    .main{ padding:0 !important; }
    .card{ box-shadow:none !important; border:1px solid #ccc !important; break-inside:avoid; }
    .stat{ box-shadow:none !important; border:1px solid #ccc !important; }
    th{ background:#eee !important; color:#000 !important; }
  }
</style>
</head>
<body>
<div class="app" id="app" style="display:none;">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-badge">🚌</div>
      <div class="brand-text">نقلة<span>إدارة نقل المدارس</span></div>
    </div>
    <div class="navlink active" data-tab="dashboard" data-roles="admin,supervisor,driver"><span class="dot"></span> الرئيسية</div>
    <div class="navlink" data-tab="attendance" data-roles="admin,supervisor,driver"><span class="dot"></span> الحضور اليومي</div>
    <div class="navlink" data-tab="reports" data-roles="admin"><span class="dot"></span> التقارير</div>
    <div class="navlink" data-tab="parents" data-roles="admin"><span class="dot"></span> أولياء الأمور</div>
    <div class="navlink" data-tab="drivers" data-roles="admin"><span class="dot"></span> السواقين</div>
    <div class="navlink" data-tab="supervisors" data-roles="admin"><span class="dot"></span> المشرفين</div>
    <div class="navlink" data-tab="staff" data-roles="admin"><span class="dot"></span> فريق العمل والدخول</div>
    <div class="navlink" data-tab="settings" data-roles="admin"><span class="dot"></span> خطوط السير والإعدادات</div>
    <div class="sidebar-foot" id="sidebarFoot"></div>
  </aside>

  <main class="main" id="main">
  </main>
</div>

<div class="login-screen" id="loginScreen">
  <div class="login-card">
    <div class="brand-badge">🚌</div>
    <h2>نقلة</h2>
    <p>سجّل دخولك بالرقم السري الخاص بك</p>
    <input id="pinInput" inputmode="numeric" maxlength="6" placeholder="••••">
    <button class="btn btn-primary" id="loginBtn">دخول</button>
    <div class="error-text" id="loginError"></div>
  </div>
</div>

<div class="loading" id="loading">جارِ الاتصال بالنظام...</div>

<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script>
/* =========================================================
   FIREBASE
========================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyBTQx8Y1Mx4DXPIweokVnA1KcwpvELNMGQ",
  authDomain: "student-transport-df97d.firebaseapp.com",
  projectId: "student-transport-df97d",
  storageBucket: "student-transport-df97d.firebasestorage.app",
  messagingSenderId: "458912338663",
  appId: "1:458912338663:web:85dac629309c74d2c58842"
};
let db;
function initFirebase(){
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
}

/* =========================================================
   STATE
========================================================= */
let STATE = { routes: [], parents: [], drivers: [], supervisors: [], staff: [], settings: { standardDays: 22, gradePrices: {} } };
let ACTIVE_TAB = 'dashboard';
let currentUser = null;
let APP_READY = false;
let attendanceState = { date: null, records: {}, routeFilter: '' };

// form UI state
let reportsState = { view:'route', routeId:'', studentId:'', month:'', duesMonth:'', duesPlan:'', date:'', dateRecords:{} };
let familyForm = { open:false, id:null };
let studentForm = { open:false, familyId:null, studentId:null };
let driverForm = { open:false, id:null };
let supForm = { open:false, id:null };
let routeForm = { open:false, id:null };
let staffForm = { open:false, id:null };

const GRADES = [
  'Play','KG1','KG2',
  'Junior 1','Junior 2','Junior 3','Junior 4','Junior 5','Junior 6',
  'Middle 1','Middle 2','Middle 3',
  'Senior 1','Senior 2','Senior 3'
];
const TYPES = [ {v:'جونيور', c:'junior'}, {v:'كيجي', c:'kg'}, {v:'تغطيات', c:'cover'} ];
const PLANS = [ {v:'شهري', c:'monthly'}, {v:'ترم', c:'term'}, {v:'سنوي', c:'yearly'} ];
const DEFAULT_ROUTE_NAMES = ['بيطاش', 'دخيلة', 'ورديان'];

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function thisMonthKey(){ return new Date().toISOString().slice(0,7); }
function fmt(n){ n = Number(n)||0; return n.toLocaleString('ar-EG'); }
function esc(s){ return (s===undefined||s===null)?'':String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function toast(msg, isErr){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.toggle('err', !!isErr);
  t.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>t.classList.remove('show'), 2400);
}

/* =========================================================
   STORAGE (Firestore) — كل مفتاح متخزن كمستند واحد في collection "state"
   ومربوط بمستمع لحظي (onSnapshot) عشان أي تعديل من أي جهاز يظهر فورًا
========================================================= */
const STATE_KEYS = ['routes','parents','drivers','supervisors','staff','settings'];

function anyFormOpen(){
  return familyForm.open || studentForm.open || driverForm.open || supForm.open || routeForm.open || staffForm.open;
}

async function saveKey(key){
  try{
    await db.collection('state').doc(key).set({ value: STATE[key] });
    return true;
  }catch(e){
    console.error('Firestore save error', e);
    toast('حدث خطأ أثناء الحفظ، تأكد من اتصال الإنترنت', true);
    return false;
  }
}

async function loadAll(){
  try{
    for(const k of STATE_KEYS){
      if(k==='staff') continue; // تم تحميلها بالفعل قبل الدخول
      const snap = await db.collection('state').doc(k).get();
      if(snap.exists && snap.data().value!==undefined){ STATE[k] = snap.data().value; }
    }
  }catch(e){
    console.error('Firestore load error', e);
    toast('تعذر تحميل البيانات، تأكد من اتصال الإنترنت', true);
  }

  if(!STATE.routes || STATE.routes.length===0){
    STATE.routes = DEFAULT_ROUTE_NAMES.map(name=>({id:uid(), name, priceJunior:0, priceKG:0, priceCoverage:0}));
    await saveKey('routes');
  }
  if(!STATE.settings) STATE.settings = { standardDays:22, gradePrices:{} };
  if(!STATE.settings.gradePrices) STATE.settings.gradePrices = {};
  if(!STATE.parents) STATE.parents = [];
  if(!STATE.drivers) STATE.drivers = [];
  if(!STATE.supervisors) STATE.supervisors = [];

  // migrate legacy flat "parents" records (old version: one row per student) into family/students shape
  if(STATE.parents && STATE.parents.length && !('students' in STATE.parents[0])){
    const byFamily = {};
    STATE.parents.forEach(old=>{
      const key = (old.parentName||'')+'|'+(old.fatherPhone||'')+'|'+(old.address||'');
      if(!byFamily[key]){
        byFamily[key] = { id: uid(), parentName: old.parentName||'', fatherPhone: old.fatherPhone||'', motherPhone: old.motherPhone||'', address: old.address||'', students: [] };
      }
      byFamily[key].students.push({
        id: old.id || uid(), name: old.student||'', grade: old.grade||'', routeId: old.routeId||'',
        plan: old.plan||'شهري', price: Number(old.price)||0, standardDays: Number(old.standardDays)||STATE.settings.standardDays,
        absences: old.absences||[]
      });
    });
    STATE.parents = Object.values(byFamily);
    await saveKey('parents');
  }

  // مستمعات لحظية: أي تعديل من جهاز تاني يحدّث الشاشة تلقائيًا (إلا لو فيه نموذج مفتوح دلوقتي)
  STATE_KEYS.forEach(k=>{
    db.collection('state').doc(k).onSnapshot(snap=>{
      if(!snap.exists) return;
      const val = snap.data().value;
      if(val===undefined) return;
      STATE[k] = val;
      if(APP_READY && !anyFormOpen()) render();
    });
  });

  document.getElementById('loading').remove();
  APP_READY = true;
  applyRoleUI();
  render();
}

/* =========================================================
   AUTH (دخول برقم سري بسيط لكل عضو فريق)
========================================================= */
function roleLabel(r){ return r==='admin' ? 'مدير' : r==='supervisor' ? 'مشرف' : r==='driver' ? 'سواق' : r; }

function getSession(){
  try{ return JSON.parse(localStorage.getItem('transport_session')||'null'); }catch(e){ return null; }
}
function setSession(id){ localStorage.setItem('transport_session', JSON.stringify({id})); }
function clearSession(){ localStorage.removeItem('transport_session'); }

async function boot(){
  try{ initFirebase(); }
  catch(e){
    console.error(e);
    document.getElementById('loading').textContent = 'تعذر الاتصال بقاعدة البيانات. تأكد من الإنترنت وحدّث الصفحة.';
    return;
  }
  try{
    const snap = await db.collection('state').doc('staff').get();
    STATE.staff = (snap.exists && snap.data().value) ? snap.data().value : [];
  }catch(e){
    console.error(e);
    document.getElementById('loading').textContent = 'تعذر الاتصال بقاعدة البيانات. تأكد من الإنترنت وحدّث الصفحة.';
    return;
  }
  if(!STATE.staff || STATE.staff.length===0){
    STATE.staff = [{ id: uid(), name:'المدير', role:'admin', pin:'1234', routeId:'' }];
    await saveKey('staff');
  }

  const session = getSession();
  if(session){
    const found = STATE.staff.find(s=>s.id===session.id);
    if(found){ await enterApp(found); return; }
    clearSession();
  }
  document.getElementById('loading').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('pinInput').focus();
}

async function enterApp(staffMember){
  currentUser = staffMember;
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  document.getElementById('loading').style.display = 'block';
  ACTIVE_TAB = currentUser.role==='admin' ? 'dashboard' : 'dashboard';
  attendanceState.date = todayISO();
  reportsState.date = todayISO();
  reportsState.month = thisMonthKey();
  reportsState.duesMonth = thisMonthKey();
  await loadAll();
}

async function doLogin(){
  const pin = document.getElementById('pinInput').value.trim();
  const err = document.getElementById('loginError');
  if(!pin){ err.textContent='من فضلك اكتب الرقم السري'; err.classList.add('show'); return; }
  const found = STATE.staff.find(s=>String(s.pin)===pin);
  if(!found){ err.textContent='الرقم السري غير صحيح'; err.classList.add('show'); return; }
  err.classList.remove('show');
  setSession(found.id);
  await enterApp(found);
}

function logout(){
  if(!confirm('تسجيل الخروج؟')) return;
  clearSession();
  location.reload();
}

document.getElementById('loginBtn').addEventListener('click', doLogin);
document.getElementById('pinInput').addEventListener('keydown', (e)=>{ if(e.key==='Enter') doLogin(); });

function applyRoleUI(){
  document.querySelectorAll('.navlink').forEach(n=>{
    const roles = (n.dataset.roles||'').split(',');
    n.style.display = roles.includes(currentUser.role) ? '' : 'none';
  });
  const allowedTabs = Array.from(document.querySelectorAll('.navlink')).filter(n=>n.style.display!=='none').map(n=>n.dataset.tab);
  if(!allowedTabs.includes(ACTIVE_TAB)) ACTIVE_TAB = allowedTabs[0] || 'dashboard';
  document.getElementById('sidebarFoot').innerHTML = `
    <div style="margin-bottom:8px;"><b>${esc(currentUser.name)}</b><span class="role-tag">${roleLabel(currentUser.role)}</span></div>
    <button class="btn btn-ghost btn-sm" data-action="logout" style="width:100%; justify-content:center;">تسجيل الخروج</button>`;
}

/* =========================================================
   HELPERS
========================================================= */
function routeById(id){ return STATE.routes.find(r=>r.id===id); }
function routeName(id){ const r = routeById(id); return r ? r.name : '—'; }
function priceForType(route, type){
  if(!route) return 0;
  if(type==='جونيور') return Number(route.priceJunior)||0;
  if(type==='كيجي') return Number(route.priceKG)||0;
  return Number(route.priceCoverage)||0;
}
function calcSalary(routeId, type, workDays){
  const route = routeById(routeId);
  const base = priceForType(route, type);
  const std = Number(STATE.settings.standardDays)||22;
  const days = Number(workDays)||0;
  return Math.round((base * (days/std)) * 100)/100;
}
function allStudentsFlat(){
  const list = [];
  STATE.parents.forEach(f=>(f.students||[]).forEach(s=>list.push({...s, family:f})));
  return list;
}

/* =========================================================
   ROOT RENDER
========================================================= */
function render(){
  document.querySelectorAll('.navlink').forEach(n=>{
    n.classList.toggle('active', n.dataset.tab === ACTIVE_TAB);
  });
  const main = document.getElementById('main');
  const adminOnly = ['parents','drivers','supervisors','settings','staff','reports'];
  if(adminOnly.includes(ACTIVE_TAB) && currentUser.role!=='admin'){ ACTIVE_TAB = 'dashboard'; }

  if(ACTIVE_TAB==='dashboard') main.innerHTML = renderDashboard();
  else if(ACTIVE_TAB==='attendance') main.innerHTML = renderAttendance();
  else if(ACTIVE_TAB==='parents') main.innerHTML = renderParents();
  else if(ACTIVE_TAB==='drivers') main.innerHTML = renderDrivers();
  else if(ACTIVE_TAB==='supervisors') main.innerHTML = renderSupervisors();
  else if(ACTIVE_TAB==='staff') main.innerHTML = renderStaff();
  else if(ACTIVE_TAB==='settings') main.innerHTML = renderSettings();
  else if(ACTIVE_TAB==='reports') main.innerHTML = renderReports();
  syncSalaryPreview();
}

document.querySelectorAll('.navlink').forEach(n=>{
  n.addEventListener('click', async ()=>{
    ACTIVE_TAB = n.dataset.tab;
    if(ACTIVE_TAB==='attendance'){
      document.getElementById('main').innerHTML = '<div class="loading">جارِ تحميل بيانات الحضور...</div>';
      await loadAttendanceForDate(attendanceState.date);
    }
    if(ACTIVE_TAB==='reports' && reportsState.view==='date'){
      document.getElementById('main').innerHTML = '<div class="loading">جارِ تحميل بيانات التقرير...</div>';
      await loadDateReport(reportsState.date);
    }
    render();
  });
});

/* =========================================================
   ATTENDANCE (الحضور اليومي)
========================================================= */
async function loadAttendanceForDate(date){
  attendanceState.date = date;
  attendanceState.records = {};
  try{
    const snap = await db.collection('attendance').where('date','==',date).get();
    snap.forEach(doc=>{ attendanceState.records[doc.data().studentId] = doc.data(); });
  }catch(e){
    console.error(e);
    toast('تعذر تحميل بيانات الحضور، تأكد من الإنترنت', true);
  }
}

async function setAttendance(studentId, familyId, routeId, status){
  const date = attendanceState.date;
  const docId = date+'__'+studentId;
  const rec = { date, studentId, familyId, routeId, status, markedBy: currentUser.name, markedByRole: currentUser.role, markedAt: new Date().toISOString() };
  try{
    await db.collection('attendance').doc(docId).set(rec);
    attendanceState.records[studentId] = rec;
    const fam = STATE.parents.find(f=>f.id===familyId);
    const st = fam && fam.students.find(s=>s.id===studentId);
    if(st){
      st.absences = st.absences||[];
      const has = st.absences.includes(date);
      if(status==='absent' && !has) st.absences.push(date);
      if(status!=='absent' && has) st.absences = st.absences.filter(d=>d!==date);
      await saveKey('parents');
    }
    toast(status==='present' ? 'تم تسجيل الحضور' : 'تم تسجيل الغياب');
    render();
  }catch(e){
    console.error(e);
    toast('تعذر الحفظ، تأكد من اتصال الإنترنت', true);
  }
}

function renderAttendance(){
  const isAdmin = currentUser.role==='admin';
  const routeOptions = STATE.routes.map(r=>`<option value="${r.id}" ${attendanceState.routeFilter===r.id?'selected':''}>${esc(r.name)}</option>`).join('');
  const scopedRouteId = isAdmin ? attendanceState.routeFilter : currentUser.routeId;

  let students = allStudentsFlat();
  if(scopedRouteId) students = students.filter(s=>s.routeId===scopedRouteId);
  else if(!isAdmin) students = [];

  const presentCount = students.filter(s=>attendanceState.records[s.id]?.status==='present').length;
  const absentCount = students.filter(s=>attendanceState.records[s.id]?.status==='absent').length;
  const unmarkedCount = students.length - presentCount - absentCount;

  const rows = students.map(s=>{
    const rec = attendanceState.records[s.id];
    const status = rec ? rec.status : null;
    return `
    <tr>
      <td><b>${esc(s.name)}</b></td>
      <td>${esc(s.family.parentName)}</td>
      <td class="mono">${esc(s.family.fatherPhone||s.family.motherPhone||'—')}</td>
      ${isAdmin && !scopedRouteId ? `<td>${esc(routeName(s.routeId))}</td>` : ''}
      <td class="status-btns">
        <button class="btn btn-sm ${status==='present'?'btn-primary':'btn-ghost'}" data-action="markPresent" data-student="${s.id}" data-family="${s.family.id}" data-route="${s.routeId}">حاضر</button>
        <button class="btn btn-sm ${status==='absent'?'btn-danger':'btn-ghost'}" data-action="markAbsentToday" data-student="${s.id}" data-family="${s.family.id}" data-route="${s.routeId}">غايب</button>
      </td>
    </tr>`;
  }).join('');

  return `
  <div class="topbar">
    <div><h1>الحضور اليومي</h1><p>سجّل حضور وغياب كل طالب — يتحدّث فورًا لباقي الفريق</p></div>
  </div>
  <div class="road"></div>
  <div class="card"><div class="card-body" style="padding:14px 18px;">
    <div class="search-bar">
      <input type="date" id="attendanceDate" value="${attendanceState.date}">
      ${isAdmin ? `<select id="attendanceRouteFilter"><option value="">كل الخطوط</option>${routeOptions}</select>` : `<span class="pill grade">${esc(routeName(currentUser.routeId))}</span>`}
    </div>
  </div></div>
  <div class="stats">
    <div class="stat"><div class="num">${fmt(presentCount)}</div><div class="lbl">حاضر</div></div>
    <div class="stat"><div class="num">${fmt(absentCount)}</div><div class="lbl">غايب</div></div>
    <div class="stat amber"><div class="num">${fmt(unmarkedCount)}</div><div class="lbl">لم يُسجل بعد</div></div>
  </div>
  <div class="card">
    <div class="card-body" style="padding:0;">
      ${students.length===0 ? emptyState('لا يوجد طلاب لعرضهم', !isAdmin && !currentUser.routeId ? 'لم يتم تحديد خط سير لك بعد — كلّم المدير' : 'اختر خط سير لعرض طلابه') : `
      <div class="table-wrap"><table>
      <thead><tr><th>الطالب</th><th>ولي الأمر</th><th>تلفون</th>${isAdmin && !scopedRouteId ? '<th>الخط</th>' : ''}<th>الحالة</th></tr></thead>
      <tbody>${rows}</tbody>
      </table></div>`}
    </div>
  </div>
  `;
}

  const students = f.students||[];
  const totalPrice = students.reduce((s,st)=>s+(Number(st.price)||0),0);
  const isAddingHere = studentForm.open && studentForm.familyId===f.id && !studentForm.studentId;
  const editingStudent = studentForm.open && studentForm.familyId===f.id && studentForm.studentId
      ? students.find(s=>s.id===studentForm.studentId) : null;
  const showStudentForm = isAddingHere || !!editingStudent;

  const nameBlob = (f.parentName+' '+students.map(s=>s.name).join(' ')).toLowerCase();
  const routeBlob = students.map(s=>s.routeId).join(',');

  return `
  <div class="family-card" data-family-id="${f.id}" data-name="${esc(nameBlob)}" data-routes="${esc(routeBlob)}">
    <div class="family-head">
      <div class="family-info">
        <b>${esc(f.parentName)||'بدون اسم'}</b>
        <div class="family-meta">
          ${f.fatherPhone?`<span>📞 الأب: ${esc(f.fatherPhone)}</span>`:''}
          ${f.motherPhone?`<span>📞 الأم: ${esc(f.motherPhone)}</span>`:''}
          ${f.address?`<span>📍 ${esc(f.address)}</span>`:''}
        </div>
      </div>
      <div class="family-stats">
        <div><div class="fs-num">${students.length}</div><div class="fs-lbl">طلاب</div></div>

async function saveStaff(form){
  const fd = new FormData(form);
  const data = Object.fromEntries(fd.entries());
  const errEl = document.getElementById('staffFormError');
  if(!data.name || !data.name.trim()){ errEl.textContent='من فضلك اكتب الاسم.'; errEl.classList.add('show'); return; }
  if(!data.pin || !/^\d{4,6}$/.test(data.pin.trim())){ errEl.textContent='الرقم السري لازم يكون من 4 إلى 6 أرقام.'; errEl.classList.add('show'); return; }
  if(data.role!=='admin' && !data.routeId){ errEl.textContent='من فضلك اختر خط السير لهذا الدور.'; errEl.classList.add('show'); return; }
  const id = form.dataset.id;
  const dup = STATE.staff.find(s=>s.pin===data.pin.trim() && s.id!==id);
  if(dup){ errEl.textContent='الرقم السري ده مستخدم بالفعل لعضو تاني.'; errEl.classList.add('show'); return; }
  errEl.classList.remove('show');
  if(id){
    const idx = STATE.staff.findIndex(s=>s.id===id);
    STATE.staff[idx] = {...STATE.staff[idx], ...data};
  } else {
    STATE.staff.push({id:uid(), ...data});
  }
  const ok = await saveKey('staff');
  if(ok){ staffForm.open=false; staffForm.id=null; toast('تم حفظ بيانات العضو'); render(); }
}

   REPORTS (خط سير / طالب / مستحقات الشهر / حضور بتاريخ معيّن)
========================================================= */
async function loadDateReport(date){
  reportsState.date = date;
  reportsState.dateRecords = {};
  try{
    const snap = await db.collection('attendance').where('date','==',date).get();
    snap.forEach(doc=>{ reportsState.dateRecords[doc.data().studentId] = doc.data(); });
  }catch(e){
    console.error(e);
    toast('تعذر تحميل بيانات الحضور لهذا اليوم، تأكد من الإنترنت', true);
  }
}

function reportNavHtml(){
  const items = [
    {v:'route', l:'تقرير خط السير'},
    {v:'student', l:'تقرير الطالب'},
    {v:'dues', l:'مستحقات الشهر'},
    {v:'date', l:'الحضور بتاريخ معيّن'}
  ];
  return `<div class="report-nav">${items.map(it=>`<button class="btn btn-sm ${reportsState.view===it.v?'btn-primary':'btn-ghost'}" data-action="reportView" data-view="${it.v}">${it.l}</button>`).join('')}</div>`;
}

function renderReports(){
  if(reportsState.view==='student') return renderReportStudent();
  if(reportsState.view==='dues') return renderReportDues();
  if(reportsState.view==='date') return renderReportDate();
  return renderReportRoute();
}

function renderReportDate(){
  const date = reportsState.date || todayISO();
  const records = reportsState.dateRecords || {};
  const students = allStudentsFlat();

  const byRoute = {};
  students.forEach(s=>{
    const rid = s.routeId||'none';
    if(!byRoute[rid]) byRoute[rid] = [];
    byRoute[rid].push(s);
  });

  let totalPresent=0, totalAbsent=0, totalUnmarked=0;

  const sections = Object.keys(byRoute).map(rid=>{
    const list = byRoute[rid];
    const rname = rid==='none' ? 'بدون خط سير' : routeName(rid);
    const rows = list.map(s=>{
      const rec = records[s.id];
      const status = rec ? rec.status : null;
      if(status==='present') totalPresent++;
      else if(status==='absent') totalAbsent++;
      else totalUnmarked++;
      const label = status==='present' ? 'حاضر' : status==='absent' ? 'غايب' : 'لم يُسجل';
      const color = status==='present' ? 'var(--good)' : status==='absent' ? 'var(--danger)' : 'var(--ink-faint)';
      return `<tr>
        <td><b>${esc(s.name)}</b></td>
        <td>${esc(s.family.parentName)}</td>
        <td class="mono">${esc(s.family.fatherPhone||s.family.motherPhone||'—')}</td>
        <td><span style="font-weight:800; color:${color};">${label}</span></td>
      </tr>`;
    }).join('');
    return `
    <div class="card">
      <div class="card-head"><h2>${esc(rname)} — ${list.length} طالب</h2></div>
      <div class="card-body" style="padding:0;">
        ${list.length===0 ? emptyState('لا يوجد طلاب على هذا الخط','') : `
        <div class="table-wrap"><table>
          <thead><tr><th>الطالب</th><th>ولي الأمر</th><th>تلفون</th><th>الحالة</th></tr></thead>
          <tbody>${rows}</tbody>
        </table></div>`}
      </div>
    </div>`;
  }).join('');

  return `
    <div class="topbar">
      <div><h1>الحضور بتاريخ معيّن</h1><p>عرض حالة كل طالب في كل خط سير ليوم محدد</p></div>
      <button class="btn btn-ghost" data-action="printReport">🖨️ طباعة</button>
    </div>
    <div class="road"></div>
    ${reportNavHtml()}
    <div class="card"><div class="card-body" style="padding:14px 18px;">
      <div class="search-bar">
        <input type="date" id="reportDate" value="${date}">
      </div>
    </div></div>
    <div class="stats" style="margin-bottom:16px;">
      <div class="stat"><div class="num">${fmt(totalPresent)}</div><div class="lbl">حاضر</div></div>
      <div class="stat"><div class="num">${fmt(totalAbsent)}</div><div class="lbl">غايب</div></div>
      <div class="stat amber"><div class="num">${fmt(totalUnmarked)}</div><div class="lbl">لم يُسجل</div></div>
    </div>
    ${students.length===0 ? `<div class="card"><div class="card-body">${emptyState('لا يوجد طلاب','')}</div></div>` : sections}
  `;
}

function syncSalaryPreview(){
  const driverForm_ = document.getElementById('driverFormEl');
  if(driverForm_){
    const update = ()=>{
      if(document.getElementById('driverManual').checked) return;
      document.getElementById('driverFinalSalary').value = calcSalary(driverForm_.routeId.value, driverForm_.type.value, driverForm_.workDays.value);

    if(!driverForm.id) update();
  }
  const supForm_ = document.getElementById('supFormEl');
  if(supForm_){
    const update = ()=>{
      if(document.getElementById('supManual').checked) return;
      document.getElementById('supFinalSalary').value = calcSalary(supForm_.routeId.value, supForm_.type.value, supForm_.workDays.value);
    };
    if(!supForm.id) update();
  }
}

/* =========================================================
   GLOBAL EVENT DELEGATION (click / change / input / submit)
========================================================= */
const main = document.getElementById('main');

main.addEventListener('click', async (ev)=>{
  const btn = ev.target.closest('[data-action]');
  if(!btn) return;
  const action = btn.dataset.action;

  switch(action){
    case 'toggleFamilyForm':
      familyForm.open = !familyForm.open; familyForm.id = null; render(); break;
    case 'cancelFamilyForm':
      familyForm.open = false; familyForm.id = null; render(); break;
    case 'editFamily':
      familyForm.open = true; familyForm.id = btn.dataset.id; render(); break;
    case 'deleteFamily': {
      if(!confirm('حذف ولي الأمر سيحذف كل الطلاب المسجلين تحته أيضًا. متابعة؟')) return;
      STATE.parents = STATE.parents.filter(f=>f.id!==btn.dataset.id);
      await saveKey('parents'); toast('تم حذف ولي الأمر وكل بياناته'); render(); break;
    }
    case 'toggleStudentForm':
      studentForm = { open:true, familyId:btn.dataset.family, studentId:null }; render(); break;
    case 'cancelStudentForm':
      studentForm = { open:false, familyId:null, studentId:null }; render(); break;
    case 'editStudent':
      studentForm = { open:true, familyId:btn.dataset.family, studentId:btn.dataset.student }; render(); break;
    case 'deleteStudent': {
      if(!confirm('حذف بيانات هذا الطالب؟')) return;
      const fam = STATE.parents.find(f=>f.id===btn.dataset.family);
      if(fam) fam.students = fam.students.filter(s=>s.id!==btn.dataset.student);
      await saveKey('parents'); toast('تم حذف الطالب'); render(); break;
    }
    case 'markAbsent': {
      const fam = STATE.parents.find(f=>f.id===btn.dataset.family);
      const st = fam?.students.find(s=>s.id===btn.dataset.student);
      if(st){ st.absences = st.absences||[]; const t = todayISO(); if(!st.absences.includes(t)) st.absences.push(t); await saveKey('parents'); toast('تم تسجيل الغياب لليوم'); render(); }
      break;
    }
    case 'unmarkAbsent': {
      const fam = STATE.parents.find(f=>f.id===btn.dataset.family);
      const st = fam?.students.find(s=>s.id===btn.dataset.student);
      if(st){ st.absences = (st.absences||[]).filter(d=>d!==btn.dataset.date); await saveKey('parents'); render(); }
      break;
    }

    case 'toggleDriverForm': driverForm.open = !driverForm.open; driverForm.id=null; render(); break;
    case 'cancelDriverForm': driverForm.open=false; driverForm.id=null; render(); break;
    case 'editDriver': driverForm.open=true; driverForm.id=btn.dataset.id; render(); break;
    case 'deleteDriver': {
      if(!confirm('حذف بيانات هذا السواق؟')) return;
      STATE.drivers = STATE.drivers.filter(d=>d.id!==btn.dataset.id);
      await saveKey('drivers'); toast('تم الحذف'); render(); break;
    }

    case 'toggleSupForm': supForm.open = !supForm.open; supForm.id=null; render(); break;
    case 'cancelSupForm': supForm.open=false; supForm.id=null; render(); break;
    case 'editSup': supForm.open=true; supForm.id=btn.dataset.id; render(); break;
    case 'deleteSup': {
      if(!confirm('حذف بيانات هذه المشرفة؟')) return;
      STATE.supervisors = STATE.supervisors.filter(s=>s.id!==btn.dataset.id);
      await saveKey('supervisors'); toast('تم الحذف'); render(); break;
    }

    case 'toggleRouteForm': routeForm.open = !routeForm.open; routeForm.id=null; render(); break;
    case 'cancelRouteForm': routeForm.open=false; routeForm.id=null; render(); break;
    case 'editRoute': routeForm.open=true; routeForm.id=btn.dataset.id; render(); break;
    case 'deleteRoute': {
      if(!confirm('حذف خط السير هذا؟')) return;
      STATE.routes = STATE.routes.filter(r=>r.id!==btn.dataset.id);
      await saveKey('routes'); toast('تم الحذف'); render(); break;
    }
    case 'saveGeneralSettings': {
      const val = Number(document.getElementById('standardDaysInput').value)||22;
      STATE.settings.standardDays = val;
      await saveKey('settings'); toast('تم حفظ الإعدادات'); render(); break;
    }
    case 'saveGradePrices': {
      document.querySelectorAll('.gradePriceInput').forEach(inp=>{
        STATE.settings.gradePrices[inp.dataset.grade] = Number(inp.value)||0;
      });
      await saveKey('settings'); toast('تم حفظ أسعار المراحل'); render(); break;
    }

    case 'saveFamily': { const f = btn.closest('form'); if(f) await saveFamily(f); break; }
    case 'saveStudent': { const f = btn.closest('form'); if(f) await saveStudent(f); break; }
    case 'saveDriver': { const f = btn.closest('form'); if(f) await saveDriver(f); break; }
    case 'saveSupervisor': { const f = btn.closest('form'); if(f) await saveSupervisor(f); break; }
    case 'saveRoute': { const f = btn.closest('form'); if(f) await saveRoute(f); break; }

    case 'markPresent': await setAttendance(btn.dataset.student, btn.dataset.family, btn.dataset.route, 'present'); break;
    case 'markAbsentToday': await setAttendance(btn.dataset.student, btn.dataset.family, btn.dataset.route, 'absent'); break;

    case 'toggleStaffForm': staffForm.open = !staffForm.open; staffForm.id=null; render(); break;
    case 'cancelStaffForm': staffForm.open=false; staffForm.id=null; render(); break;
    case 'editStaff': staffForm.open=true; staffForm.id=btn.dataset.id; render(); break;
    case 'deleteStaff': {
      const target = STATE.staff.find(s=>s.id===btn.dataset.id);
      if(target && target.role==='admin' && STATE.staff.filter(s=>s.role==='admin').length<=1){
        toast('لازم يفضل مدير واحد على الأقل في النظام', true); break;
      }
      if(!confirm('حذف هذا العضو من الفريق؟ لن يقدر يدخل النظام بعدها.')) return;
      STATE.staff = STATE.staff.filter(s=>s.id!==btn.dataset.id);
      await saveKey('staff'); toast('تم حذف العضو'); render(); break;
    }
    case 'saveStaff': { const f = btn.closest('form'); if(f) await saveStaff(f); break; }

    case 'reportView': {
      reportsState.view = btn.dataset.view;
      if(reportsState.view==='date'){
        main.innerHTML = '<div class="loading">جارِ تحميل بيانات الحضور...</div>';
        await loadDateReport(reportsState.date || todayISO());
      }
      render();
      break;
    }
    case 'printReport': window.print(); break;

    case 'logout': logout(); break;
  }
});

main.addEventListener('change', (ev)=>{
  const t = ev.target;
  // auto-suggest student price from grade
  if(t.name==='grade' && t.closest('#studentFormEl')){
    const price = STATE.settings.gradePrices[t.value];
    const priceInput = document.getElementById('studentPriceInput');
    if(price!==undefined && priceInput && (!priceInput.value || priceInput.dataset.autofilled==='1')){
      priceInput.value = price;
      priceInput.dataset.autofilled = '1';
    }
  }
  if((t.name==='routeId' || t.name==='type' || t.name==='workDays' || t.id==='driverManual') && t.closest('#driverFormEl')){
    syncSalaryPreview();
  }
  if((t.name==='routeId' || t.name==='type' || t.name==='workDays' || t.id==='supManual') && t.closest('#supFormEl')){
    syncSalaryPreview();
  }
});
main.addEventListener('input', (ev)=>{
  const t = ev.target;
  if(t.name==='workDays' && t.closest('#driverFormEl')) syncSalaryPreview();
  if(t.name==='workDays' && t.closest('#supFormEl')) syncSalaryPreview();
  if(t.id==='studentPriceInput') t.dataset.autofilled='0';

  if(t.id==='parentSearch' || t.id==='parentFilterRoute') applyFamilyFilter();
});
main.addEventListener('change', async (ev)=>{
  if(ev.target.id==='parentFilterRoute') applyFamilyFilter();
  if(ev.target.id==='attendanceDate'){
    main.innerHTML = '<div class="loading">جارِ تحميل بيانات الحضور...</div>';
    await loadAttendanceForDate(ev.target.value);
    render();
  }
  if(ev.target.id==='attendanceRouteFilter'){
    attendanceState.routeFilter = ev.target.value;
    render();
  }
  if(ev.target.id==='reportRouteSelect'){ reportsState.routeId = ev.target.value; render(); }
  if(ev.target.id==='reportMonthInput'){ reportsState.month = ev.target.value; render(); }
  if(ev.target.id==='reportStudentSelect'){ reportsState.studentId = ev.target.value; render(); }
  if(ev.target.id==='reportDuesMonth'){ reportsState.duesMonth = ev.target.value; render(); }
  if(ev.target.id==='reportDuesPlan'){ reportsState.duesPlan = ev.target.value; render(); }
  if(ev.target.id==='reportDate'){
    main.innerHTML = '<div class="loading">جارِ تحميل بيانات الحضور...</div>';
    await loadDateReport(ev.target.value);
    render();
  }
});

function applyFamilyFilter(){
  const search = document.getElementById('parentSearch');
  const filterRoute = document.getElementById('parentFilterRoute');
  if(!search || !filterRoute) return;
  const q = (search.value||'').toLowerCase();
  const rid = filterRoute.value;
  document.querySelectorAll('.family-card').forEach(card=>{
    const matchesQ = card.dataset.name.includes(q);
    const routes = (card.dataset.routes||'').split(',');
    const matchesR = !rid || routes.includes(rid);
    card.style.display = (matchesQ && matchesR) ? '' : 'none';
  });
}

/* ---- Save functions: called directly from button clicks (reliable even
   inside sandboxed iframes that may silently block native form submission) ---- */
async function saveFamily(form){
  const fd = new FormData(form);
  const data = Object.fromEntries(fd.entries());
  const errEl = document.getElementById('familyFormError');
  if(!data.parentName || !data.parentName.trim()){
    errEl.textContent = 'من فضلك اكتب اسم ولي الأمر.'; errEl.classList.add('show'); return;
  }
  errEl.classList.remove('show');
  const id = form.dataset.id;
  if(id){
    const idx = STATE.parents.findIndex(f=>f.id===id);
    STATE.parents[idx] = {...STATE.parents[idx], ...data};
  } else {
    STATE.parents.push({id:uid(), ...data, students:[]});
  }
  const ok = await saveKey('parents');
  if(ok){ familyForm.open=false; familyForm.id=null; toast('تم حفظ بيانات ولي الأمر'); render(); }
}

async function saveStudent(form){
  const fd = new FormData(form);
  const data = Object.fromEntries(fd.entries());
  const errEl = document.getElementById('studentFormError');
  if(!data.name || !data.name.trim()){ errEl.textContent='من فضلك اكتب اسم الطالب.'; errEl.classList.add('show'); return; }
  if(!data.grade){ errEl.textContent='من فضلك اختر المرحلة الدراسية.'; errEl.classList.add('show'); return; }
  errEl.classList.remove('show');

  const familyId = form.dataset.family;
  const fam = STATE.parents.find(f=>f.id===familyId);
  if(!fam){ toast('تعذر إيجاد ولي الأمر', true); return; }

  const studentId = form.dataset.student;
  const payload = {
    name: data.name.trim(), grade: data.grade, routeId: data.routeId||'', plan: data.plan||'شهري',
    price: Number(data.price)||0, standardDays: Number(data.standardDays)||STATE.settings.standardDays
  };

  if(studentId){
    const idx = fam.students.findIndex(s=>s.id===studentId);
    fam.students[idx] = {...fam.students[idx], ...payload};
  } else {
    fam.students.push({id:uid(), ...payload, absences:[]});
  }
  const ok = await saveKey('parents');
  if(ok){
    studentForm = {open:false, familyId:null, studentId:null};
    toast('تم حفظ بيانات الطالب');
    render();
  }
}

async function saveDriver(form){
  const fd = new FormData(form);
  const data = Object.fromEntries(fd.entries());
  const errEl = document.getElementById('driverFormError');
  if(!data.name || !data.name.trim()){ errEl.textContent='من فضلك اكتب اسم السواق.'; errEl.classList.add('show'); return; }
  if(!data.routeId){ errEl.textContent='من فضلك اختر خط السير.'; errEl.classList.add('show'); return; }
  errEl.classList.remove('show');
  data.manual = document.getElementById('driverManual').checked;
  data.workDays = Number(data.workDays)||0;
  data.finalSalary = Number(data.finalSalary)||0;
  const id = form.dataset.id;
  if(id){ const idx = STATE.drivers.findIndex(d=>d.id===id); STATE.drivers[idx] = {...STATE.drivers[idx], ...data}; }
  else { STATE.drivers.push({id:uid(), ...data}); }
  const ok = await saveKey('drivers');
  if(ok){ driverForm.open=false; driverForm.id=null; toast('تم حفظ بيانات السواق'); render(); }
}

}

/* Thin fallback: if a native submit event ever does fire (e.g. Enter key
   on some keyboards), route it to the same save functions instead of
   letting the browser navigate/reload the frame. */
main.addEventListener('submit', (ev)=>{
  const form = ev.target.closest('form[data-form-type]');
  if(!form) return;
  ev.preventDefault();
  const type = form.dataset.formType;
  if(type==='family') saveFamily(form);
  else if(type==='student') saveStudent(form);
  else if(type==='driver') saveDriver(form);
  else if(type==='supervisor') saveSupervisor(form);
  else if(type==='route') saveRoute(form);
  else if(type==='staff') saveStaff(form);
});

/* =========================================================
   INIT
========================================================= */
boot();
</script>
